<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="40%" stop-color="#F5B82E"/>
      <stop offset="70%" stop-color="#D9820A"/>
      <stop offset="100%" stop-color="#B86500"/>
    </linearGradient>

    <linearGradient id="emeraldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58E29B"/>
      <stop offset="50%" stop-color="#3BB77E"/>
      <stop offset="100%" stop-color="#197A48"/>
    </linearGradient>

    <linearGradient id="nestTwigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C5B0E"/>
      <stop offset="50%" stop-color="#D48B1C"/>
      <stop offset="100%" stop-color="#7A4204"/>
    </linearGradient>

    <linearGradient id="birdBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="textSlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#253D4E"/>
      <stop offset="100%" stop-color="#182A36"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3BB77E" flood-opacity="0.28"/>
    </filter>
    <filter id="cartShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM (BIRD IN NEST + CART + LEAF) ================= -->
  <g transform="translate(4, 2)" filter="url(#softGlow)">
    <!-- Back Emerald Leaf 1 -->
    <path d="M12 22 C10 10, 20 2, 28 3 C30 11, 24 23, 12 22 Z" fill="url(#emeraldLeaf)"/>
    <!-- Back Emerald Leaf 2 -->
    <path d="M38 18 C46 9, 52 14, 50 24 C43 27, 36 24, 38 18 Z" fill="url(#emeraldLeaf)"/>

    <!-- Woven Twig Nest (Base) -->
    <ellipse cx="28" cy="38" rx="22" ry="9" fill="url(#nestTwigGrad)"/>
    <!-- Intertwined twigs pattern -->
    <path d="M9 36 C18 42, 38 42, 47 36" stroke="#FFE082" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M11 39 C22 45, 34 45, 45 39" stroke="#9C5B0E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M14 34 C25 39, 31 39, 42 34" stroke="#FFCA28" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Cute Bird in the Nest -->
    <!-- Bird Body -->
    <path d="M19 32 C17 22, 23 15, 31 16 C38 17, 43 23, 41 31 C37 34, 24 35, 19 32 Z" fill="url(#birdBody)" filter="url(#cartShadow)"/>
    <!-- Bird Wing -->
    <path d="M22 28 C26 23, 33 22, 37 28 C33 32, 26 31, 22 28 Z" fill="url(#goldLuxury)"/>
    <!-- Bird Head Highlight -->
    <circle cx="24" cy="20" r="1.8" fill="#1E293B"/> <!-- Eye -->
    <circle cx="24.5" cy="19.5" r="0.6" fill="#FFFFFF"/> <!-- Eye reflection -->
    <!-- Golden Beak -->
    <polygon points="17,21 12,23 17,25" fill="#F59E0B"/>
    <!-- Small Crest Feather -->
    <path d="M26 15 C25 11, 22 10, 20 11 C22 13, 24 14, 26 15 Z" fill="url(#goldLuxury)"/>

    <!-- Front Glossy Leaf -->
    <path d="M6 34 C4 26, 12 23, 17 27 C16 34, 10 37, 6 34 Z" fill="url(#emeraldLeaf)"/>
    <path d="M7 32 C10 30, 13 28, 15 26" stroke="#FFFFFF" stroke-width="0.9" fill="none" opacity="0.8"/>

    <!-- Golden Mini Shopping Cart Accent -->
    <g transform="translate(35, 18) scale(0.68)" filter="url(#cartShadow)">
      <!-- Cart Basket Frame -->
      <path d="M2 3 L6 3 L10 17 L24 17 L27 7 L9 7" fill="none" stroke="url(#goldLuxury)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Grid lines -->
      <line x1="12" y1="11" x2="25" y2="11" stroke="url(#goldLuxury)" stroke-width="1.6"/>
      <line x1="14" y1="7" x2="14" y2="17" stroke="url(#goldLuxury)" stroke-width="1.6"/>
      <line x1="20" y1="7" x2="20" y2="17" stroke="url(#goldLuxury)" stroke-width="1.6"/>
      <!-- Wheels -->
      <circle cx="12" cy="21" r="2.4" fill="url(#goldLuxury)"/>
      <circle cx="22" cy="21" r="2.4" fill="url(#goldLuxury)"/>
      <!-- Green Eco Bag inside Cart -->
      <path d="M12 7 L12 4 C12 2.5, 14 1.5, 16 1.5 C18 1.5, 20 2.5, 20 4 L20 7 Z" fill="none" stroke="#3BB77E" stroke-width="1.4"/>
      <rect x="13" y="6" width="6" height="8" rx="1" fill="#3BB77E"/>
    </g>
  </g>

  <!-- ================= BRAND TYPOGRAPHY: NEST ================= -->
  <g transform="translate(68, 8)">
    <!-- Letter N with Green Leaf Accent -->
    <text x="0" y="30" font-family="'Quicksand', 'Montserrat', sans-serif" font-size="34" font-weight="900" fill="url(#textSlate)" letter-spacing="1">N</text>
    <!-- Organic Leaf diagonal inside N -->
    <path d="M5 28 C9 20, 18 15, 23 11 C21 18, 15 25, 5 28 Z" fill="url(#emeraldLeaf)" opacity="0.95"/>

    <!-- Letter E -->
    <text x="31" y="30" font-family="'Quicksand', 'Montserrat', sans-serif" font-size="34" font-weight="900" fill="url(#textSlate)" letter-spacing="1">E</text>

    <!-- Letter S -->
    <text x="59" y="30" font-family="'Quicksand', 'Montserrat', sans-serif" font-size="34" font-weight="900" fill="url(#textSlate)" letter-spacing="1">S</text>

    <!-- Letter T -->
    <text x="86" y="30" font-family="'Quicksand', 'Montserrat', sans-serif" font-size="34" font-weight="900" fill="url(#textSlate)" letter-spacing="1">T</text>

    <!-- Sparkle / Star over T -->
    <path d="M112 7 L114 11 L118 13 L114 15 L112 19 L110 15 L106 13 L110 11 Z" fill="url(#goldLuxury)"/>

    <!-- Subtitle: E - C O M M E R C E -->
    <g transform="translate(1, 40)">
      <line x1="0" y1="-4" x2="18" y2="-4" stroke="url(#goldLuxury)" stroke-width="1.2" stroke-linecap="round"/>
      <text x="24" y="0" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#3BB77E" letter-spacing="3.2">SUPERMARKET</text>
      <line x1="120" y1="-4" x2="138" y2="-4" stroke="url(#goldLuxury)" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
