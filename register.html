<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - NEST Supermarket</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/logo.svg">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <!-- Logo -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
            <img src="assets/images/logo/logo.svg" alt="NEST Logo" height="52">
            <!-- <span class="fs-2 fw-bold text-dark font-quicksand">NEST</span> -->
          </a>
          <h4 class="fw-bold mt-3 text-dark">Create an Account</h4>
          <p class="text-muted small">Start shopping with daily deals and fast delivery</p>
        </div>

        <!-- Register Card -->
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          <form id="customer-register-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Full Name *</label>
              <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address *</label>
              <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Mobile Phone *</label>
              <input type="tel" id="reg-phone" class="form-control" placeholder="+91 91234 56789" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Password *</label>
              <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters"
                required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Confirm Password *</label>
              <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat your password"
                required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill fw-bold shadow-sm mt-3">
              Create My Account
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top small">
            Already have an account? <a href="login.html" class="text-success fw-bold text-decoration-none">Sign In</a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back
            to Homepage</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
