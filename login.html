<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login - NEST Supermarket</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/logo.svg">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <!-- Logo -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
            <img src="assets/images/logo/logo.svg" alt="NEST Logo" height="52">
            <!-- <span class="fs-2 fw-bold text-dark font-quicksand">NEST</span> -->
          </a>
          <h4 class="fw-bold mt-3 text-dark">Sign in to your account</h4>
          <p class="text-muted small">Access your orders, wishlist, and exclusive discounts</p>
        </div>

        <!-- Login Card -->
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          <form id="customer-login-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="login-email" class="form-control border-start-0" placeholder="name@example.com"
                  required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label small fw-semibold mb-0">Password</label>
                <a href="#" class="small text-success text-decoration-none"
                  onclick="alert('Demo password is customer123')">Forgot password?</a>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" id="login-password" class="form-control border-start-0"
                  placeholder="Enter your password" required>
              </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill fw-bold shadow-sm mt-3">
              Sign In
            </button>
          </form>

          <!-- Demo Credentials Helper -->
          <div class="mt-4 p-3 bg-light rounded-3 border">
            <div class="small fw-bold text-dark mb-1"><i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Login:
            </div>
            <div class="d-flex gap-2 flex-wrap mt-2">
              <button type="button" class="btn btn-sm btn-outline-success"
                onclick="document.getElementById('login-email').value='customer@nest.com'; document.getElementById('login-password').value='customer123';">
                Customer Demo
              </button>
              <button type="button" class="btn btn-sm btn-outline-dark"
                onclick="document.getElementById('login-email').value='admin@nest.com'; document.getElementById('login-password').value='admin123';">
                Admin Demo
              </button>
            </div>
          </div>

          <div class="text-center mt-4 pt-3 border-top small">
            Don't have an account yet? <a href="register.html" class="text-success fw-bold text-decoration-none">Create
              Account</a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back
            to Homepage</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
