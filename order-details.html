<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking &amp; Details - NEST Supermarket</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/logo.svg">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container-xl d-flex justify-content-between align-items-center">
      <div><i class="bi bi-geo-alt-fill text-success me-1"></i> Deliver to: <strong>Bengaluru, 560038</strong></div>
      <div class="d-flex align-items-center gap-3">
        <a href="order-details.html" class="fw-bold"><i class="bi bi-truck me-1"></i> Track Order</a>
        <span class="top-bar-divider"></span>
        <a href="admin/dashboard.html" class="fw-bold text-success"><i class="bi bi-shield-lock me-1"></i> Admin
          Panel</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="header sticky-top bg-white border-bottom shadow-xs">
    <div class="container-xl py-3">
      <div class="row align-items-center g-3">
        <div class="col-6 col-lg-2">
          <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <img src="assets/images/logo/logo.svg" alt="NEST Supermarket" height="46">
            <!-- <span class="fw-bold text-dark fs-3 font-quicksand">NEST</span> -->
          </a>
        </div>
        <div class="col-12 col-lg-6 order-3 order-lg-2">
          <form class="header-search-form d-flex align-items-center">
            <input type="text" name="search" class="form-control border-0 shadow-none" placeholder="Search products..."
              autocomplete="off">
            <button type="submit" class="btn btn-success rounded-pill px-4 ms-2"><i class="bi bi-search"></i></button>
          </form>
        </div>
        <div class="col-6 col-lg-4 order-2 order-lg-3 text-end">
          <div class="d-flex align-items-center justify-content-end gap-3">
            <a href="wishlist.html" class="nav-action-item position-relative text-decoration-none">
              <i class="bi bi-heart fs-4"></i>
              <span class="action-badge wishlist-count-badge">0</span>
              <span class="d-none d-xl-inline ms-1 fw-semibold">Wishlist</span>
            </a>
            <a href="cart.html" class="nav-action-item position-relative text-decoration-none">
              <i class="bi bi-cart3 fs-4"></i>
              <span class="action-badge cart-count-badge">0</span>
              <span class="d-none d-xl-inline ms-1 fw-semibold">Cart</span>
            </a>
            <div id="header-user-menu"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Breadcrumb -->
  <div class="bg-light py-3 border-bottom">
    <div class="container-xl">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted">Home</a></li>
          <li class="breadcrumb-item"><a href="my-orders.html" class="text-decoration-none text-muted">My Orders</a>
          </li>
          <li class="breadcrumb-item active text-success fw-bold" aria-current="page">Track Order</li>
        </ol>
      </nav>
    </div>
  </div>

  <main class="py-5">
    <div class="container-xl">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="fw-bold text-dark font-quicksand mb-0">Track Shipment</h2>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary rounded-pill px-3" onclick="window.print()">
            <i class="bi bi-printer me-1"></i> Print Invoice
          </button>
          <a href="my-orders.html" class="btn btn-outline-success rounded-pill px-3">
            <i class="bi bi-arrow-left me-1"></i> Back to Orders
          </a>
        </div>
      </div>

      <!-- Order Details & Timeline Container -->
      <div id="order-details-container"></div>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <ul class="mobile-bottom-nav-items">
      <li class="mobile-bottom-nav-item"><a href="index.html"><i class="bi bi-house"></i><span>Home</span></a></li>
      <li class="mobile-bottom-nav-item"><a href="shop.html"><i class="bi bi-grid"></i><span>Shop</span></a></li>
      <li class="mobile-bottom-nav-item"><a href="wishlist.html"><i class="bi bi-heart"></i><span
            class="mobile-bottom-nav-badge wishlist-count-badge">0</span><span>Wishlist</span></a></li>
      <li class="mobile-bottom-nav-item"><a href="cart.html"><i class="bi bi-cart"></i><span
            class="mobile-bottom-nav-badge cart-count-badge">0</span><span>Cart</span></a></li>
      <li class="mobile-bottom-nav-item"><a href="my-account.html"><i class="bi bi-person"></i><span>Account</span></a>
      </li>
    </ul>
  </nav>

  <footer class="footer bg-white border-top py-4 text-center text-muted small">
    &copy; 2026 NEST E-Commerce Inc. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/orders.js"></script>
</body>

</html>
