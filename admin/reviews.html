<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Reviews - NEST Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/logo.svg">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-body">

  <aside class="admin-sidebar">
    <a href="dashboard.html" class="admin-sidebar-brand"><img src="../assets/images/logo/logo-white.svg" alt="NEST Admin" height="42" style="width: auto; max-width: 195px;"></a>

    <div class="admin-nav-wrap">
      <div class="admin-nav-section-title">Core</div>
      <a href="dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>

      <div class="admin-nav-section-title">Catalog &amp; Sales</div>
      <a href="products.html" class="admin-nav-link"><i class="bi bi-box-seam"></i><span>Products</span></a>
      <a href="add-product.html" class="admin-nav-link"><i class="bi bi-plus-circle"></i><span>Add Product</span></a>
      <a href="categories.html" class="admin-nav-link"><i class="bi bi-tag"></i><span>Categories</span></a>
      <a href="orders.html" class="admin-nav-link"><i class="bi bi-cart-check"></i><span>Orders</span></a>

      <div class="admin-nav-section-title">Management</div>
      <a href="customers.html" class="admin-nav-link"><i class="bi bi-people"></i><span>Customers</span></a>
      <a href="inventory.html" class="admin-nav-link"><i class="bi bi-boxes"></i><span>Inventory</span></a>
      <a href="coupons.html" class="admin-nav-link"><i class="bi bi-ticket-perforated"></i><span>Coupons</span></a>
      <a href="reviews.html" class="admin-nav-link active"><i class="bi bi-star"></i><span>Reviews</span></a>
      <a href="reports.html" class="admin-nav-link"><i class="bi bi-graph-up"></i><span>Reports</span></a>
      <a href="settings.html" class="admin-nav-link"><i class="bi bi-gear"></i><span>Settings</span></a>

      <div class="admin-nav-section-title">Links</div>
      <a href="../index.html" class="admin-nav-link" target="_blank"><i class="bi bi-box-arrow-up-right"></i><span>View Storefront</span></a>
      <a href="javascript:void(0)" onclick="logoutUser()" class="admin-nav-link text-danger mt-3"><i class="bi bi-box-arrow-right"></i><span>Sign Out</span></a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <h5 class="fw-bold m-0 text-dark font-quicksand">Customer Ratings &amp; Feedback Moderation</h5>
    </header>

    <main class="admin-content">
      <div class="admin-table-card">
        <div class="admin-table-header">
          <h6 class="fw-bold m-0 text-dark">Customer Reviews</h6>
        </div>
        <div class="table-responsive">
          <table class="table admin-table align-middle">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Product ID</th>
                <th>Rating</th>
                <th>Comment</th>
                <th>Date</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-reviews-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderReviews();
    });

    function renderReviews() {
      const tbody = document.getElementById("admin-reviews-tbody");
      if (!tbody) return;

      const reviews = window.NestDB ? window.NestDB.findAll("reviews") : [];
      if (reviews.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No reviews submitted yet</td></tr>`;
        return;
      }

      tbody.innerHTML = reviews.map(r => `
        <tr>
          <td><strong>${r.userName}</strong></td>
          <td><code>${r.productId}</code></td>
          <td><span class="text-warning">★ ${r.rating}.0</span></td>
          <td style="max-width: 280px;" class="text-truncate">${r.comment}</td>
          <td>${r.date || 'Recent'}</td>
          <td><span class="status-pill status-${r.status === 'approved' ? 'completed' : 'pending'}">${(r.status || 'approved').toUpperCase()}</span></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-success me-1" onclick="approveReview('${r.id}')"><i class="bi bi-check-lg"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteReview('${r.id}')"><i class="bi bi-trash3"></i></button>
          </td>
        </tr>
      `).join("");
    }

    function approveReview(id) {
      if (window.NestDB) {
        window.NestDB.update("reviews", id, { status: "approved" });
        showToast("Review approved and published!");
        renderReviews();
      }
    }

    function deleteReview(id) {
      if (confirm("Delete this review?")) {
        if (window.NestDB) {
          window.NestDB.delete("reviews", id);
          showToast("Review deleted");
          renderReviews();
        }
      }
    }
  </script>
</body>
</html>
