<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - NEST E-Commerce</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/logo.svg">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body style="background: linear-gradient(135deg, #0D2624 0%, #173e3b 100%); min-height: 100vh;" class="d-flex align-items-center justify-content-center py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <!-- Brand Header -->
        <div class="text-center mb-4">
          <div class="mb-3"><img src="../assets/images/logo/logo-white.svg" alt="NEST Admin" height="52"></div>
          <p class="text-white-50 small">Store Administrator Control Panel</p>
        </div>

        <!-- Login Card -->
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
          <h4 class="fw-bold text-dark mb-1">Admin Access</h4>
          <p class="text-muted small mb-4">Enter privileged credentials to proceed</p>

          <form id="admin-login-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Admin Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-lock text-muted"></i></span>
                <input type="email" id="admin-email" class="form-control" value="admin@nest.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold">Admin Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key text-muted"></i></span>
                <input type="password" id="admin-password" class="form-control" value="admin123" required>
              </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill fw-bold shadow-sm">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
            </button>
          </form>

          <!-- Quick Fill Chip -->
          <div class="mt-4 p-3 bg-light rounded-3 text-center border">
            <span class="small text-muted d-block mb-1">Demo Administrator Credentials:</span>
            <code>admin@nest.com</code> / <code>admin123</code>
          </div>

          <div class="text-center mt-3">
            <a href="../index.html" class="small text-muted text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Return to Customer Storefront
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
