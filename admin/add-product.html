<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - NEST Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/logo.svg">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-body">

  <aside class="admin-sidebar">
    <a href="dashboard.html" class="admin-sidebar-brand"><img src="../assets/images/logo/logo-white.svg" alt="NEST Admin" height="42" style="width: auto; max-width: 195px;"></a>

    <div class="admin-nav-wrap">
      <div class="admin-nav-section-title">Core</div>
      <a href="dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>

      <div class="admin-nav-section-title">Catalog &amp; Sales</div>
      <a href="products.html" class="admin-nav-link"><i class="bi bi-box-seam"></i><span>Products</span></a>
      <a href="add-product.html" class="admin-nav-link active"><i class="bi bi-plus-circle"></i><span>Add Product</span></a>
      <a href="categories.html" class="admin-nav-link"><i class="bi bi-tag"></i><span>Categories</span></a>
      <a href="orders.html" class="admin-nav-link"><i class="bi bi-cart-check"></i><span>Orders</span></a>

      <div class="admin-nav-section-title">Management</div>
      <a href="customers.html" class="admin-nav-link"><i class="bi bi-people"></i><span>Customers</span></a>
      <a href="inventory.html" class="admin-nav-link"><i class="bi bi-boxes"></i><span>Inventory</span></a>
      <a href="coupons.html" class="admin-nav-link"><i class="bi bi-ticket-perforated"></i><span>Coupons</span></a>
      <a href="reviews.html" class="admin-nav-link"><i class="bi bi-star"></i><span>Reviews</span></a>
      <a href="reports.html" class="admin-nav-link"><i class="bi bi-graph-up"></i><span>Reports</span></a>
      <a href="settings.html" class="admin-nav-link"><i class="bi bi-gear"></i><span>Settings</span></a>

      <div class="admin-nav-section-title">Links</div>
      <a href="../index.html" class="admin-nav-link" target="_blank"><i class="bi bi-box-arrow-up-right"></i><span>View Storefront</span></a>
      <a href="javascript:void(0)" onclick="logoutUser()" class="admin-nav-link text-danger mt-3"><i class="bi bi-box-arrow-right"></i><span>Sign Out</span></a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <h5 class="fw-bold m-0 text-dark font-quicksand">Create New Store Product</h5>
      <a href="products.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Back to Products
      </a>
    </header>

    <main class="admin-content">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <form id="admin-add-product-form">
              <div class="row g-4">
                <div class="col-12">
                  <h6 class="fw-bold text-dark border-bottom pb-2">Basic Product Information</h6>
                </div>

                <div class="col-md-8">
                  <label class="form-label small fw-semibold">Product Title *</label>
                  <input type="text" id="prod-name" class="form-control" placeholder="e.g. Organic Raw Honey 500g" required>
                </div>

                <div class="col-md-4">
                  <label class="form-label small fw-semibold">Category *</label>
                  <select id="prod-category" class="form-select" required>
                    <option value="groceries">Fresh Fruits &amp; Organic Groceries</option>
                    <option value="electronics">Electronics &amp; Smart Gadgets</option>
                    <option value="furniture">Furniture &amp; Modern Living</option>
                    <option value="fashion">Fashion &amp; Lifestyle</option>
                    <option value="beauty">Beauty &amp; Herbal Wellness</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label small fw-semibold">Sale Price (₹) *</label>
                  <input type="number" id="prod-price" class="form-control" placeholder="399" min="1" required>
                </div>

                <div class="col-md-4">
                  <label class="form-label small fw-semibold">Regular / Original Price (₹)</label>
                  <input type="number" id="prod-oldprice" class="form-control" placeholder="499" min="1">
                </div>

                <div class="col-md-4">
                  <label class="form-label small fw-semibold">Initial Stock Quantity *</label>
                  <input type="number" id="prod-stock" class="form-control" placeholder="50" min="0" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold">SKU / Item Identifier</label>
                  <input type="text" id="prod-sku" class="form-control" placeholder="GRO-HON-009">
                </div>

                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Initial Product Image (Preset)</label>
                  <input type="text" class="form-control bg-light" value="assets/images/products/apples-1.jpg" readonly>
                </div>

                <div class="col-12">
                  <label class="form-label small fw-semibold">Product Description *</label>
                  <textarea id="prod-desc" class="form-control" rows="4" placeholder="Detailed product specifications, organic origin, and nutritional/functional highlights..." required></textarea>
                </div>

                <div class="col-12 text-end pt-3 border-top">
                  <button type="submit" class="btn btn-success btn-lg rounded-pill px-5 fw-bold shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> Publish Product
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin/products.js"></script>
</body>
</html>
