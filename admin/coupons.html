<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Coupons - NEST Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/logo.svg">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-body">

  <aside class="admin-sidebar">
    <a href="dashboard.html" class="admin-sidebar-brand"><img src="../assets/images/logo/logo-white.svg" alt="NEST Admin" height="42" style="width: auto; max-width: 195px;"></a>

    <div class="admin-nav-wrap">
      <div class="admin-nav-section-title">Core</div>
      <a href="dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>

      <div class="admin-nav-section-title">Catalog &amp; Sales</div>
      <a href="products.html" class="admin-nav-link"><i class="bi bi-box-seam"></i><span>Products</span></a>
      <a href="add-product.html" class="admin-nav-link"><i class="bi bi-plus-circle"></i><span>Add Product</span></a>
      <a href="categories.html" class="admin-nav-link"><i class="bi bi-tag"></i><span>Categories</span></a>
      <a href="orders.html" class="admin-nav-link"><i class="bi bi-cart-check"></i><span>Orders</span></a>

      <div class="admin-nav-section-title">Management</div>
      <a href="customers.html" class="admin-nav-link"><i class="bi bi-people"></i><span>Customers</span></a>
      <a href="inventory.html" class="admin-nav-link"><i class="bi bi-boxes"></i><span>Inventory</span></a>
      <a href="coupons.html" class="admin-nav-link active"><i class="bi bi-ticket-perforated"></i><span>Coupons</span></a>
      <a href="reviews.html" class="admin-nav-link"><i class="bi bi-star"></i><span>Reviews</span></a>
      <a href="reports.html" class="admin-nav-link"><i class="bi bi-graph-up"></i><span>Reports</span></a>
      <a href="settings.html" class="admin-nav-link"><i class="bi bi-gear"></i><span>Settings</span></a>

      <div class="admin-nav-section-title">Links</div>
      <a href="../index.html" class="admin-nav-link" target="_blank"><i class="bi bi-box-arrow-up-right"></i><span>View Storefront</span></a>
      <a href="javascript:void(0)" onclick="logoutUser()" class="admin-nav-link text-danger mt-3"><i class="bi bi-box-arrow-right"></i><span>Sign Out</span></a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <h5 class="fw-bold m-0 text-dark font-quicksand">Promotional Coupons &amp; Discounts</h5>
    </header>

    <main class="admin-content">
      <div class="row g-4">
        <!-- Add Coupon -->
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <h6 class="fw-bold text-dark mb-3">Create Promo Coupon</h6>
            <form id="admin-add-coupon-form">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Coupon Code *</label>
                <input type="text" id="coupon-code" class="form-control text-uppercase" placeholder="e.g. FLASH25" required>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Discount Type</label>
                <select id="coupon-type" class="form-select">
                  <option value="percent">Percentage (%) Off</option>
                  <option value="fixed">Fixed Amount (₹) Off</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Discount Value *</label>
                <input type="number" id="coupon-val" class="form-control" placeholder="15" min="1" required>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Minimum Spend (₹)</label>
                <input type="number" id="coupon-min" class="form-control" placeholder="499" value="499">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Expiry Date</label>
                <input type="date" id="coupon-expiry" class="form-control" value="2027-12-31">
              </div>
              <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold">
                <i class="bi bi-plus-lg me-1"></i> Save Coupon
              </button>
            </form>
          </div>
        </div>

        <!-- Coupons Table -->
        <div class="col-lg-8">
          <div class="admin-table-card">
            <div class="admin-table-header">
              <h6 class="fw-bold m-0 text-dark">Active Coupon Codes</h6>
            </div>
            <div class="table-responsive">
              <table class="table admin-table align-middle">
                <thead>
                  <tr>
                    <th>Code</th>
                    <th>Type</th>
                    <th>Value</th>
                    <th>Min Spend</th>
                    <th>Expiry</th>
                    <th>Status</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="admin-coupons-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderCoupons();
      setupCouponForm();
    });

    function renderCoupons() {
      const tbody = document.getElementById("admin-coupons-tbody");
      if (!tbody) return;

      const coupons = window.NestDB ? window.NestDB.findAll("coupons") : [];
      tbody.innerHTML = coupons.map(c => `
        <tr>
          <td><span class="badge bg-success-subtle text-success fs-6 fw-bold">${c.code}</span></td>
          <td class="text-capitalize">${c.discountType}</td>
          <td class="fw-bold">${c.discountType === 'percent' ? c.value + '%' : '₹' + c.value}</td>
          <td>₹${c.minSpend || 0}</td>
          <td>${c.expiryDate}</td>
          <td><span class="status-pill status-${c.status}">${c.status.toUpperCase()}</span></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger" onclick="deleteCoupon('${c.id || c.code}')"><i class="bi bi-trash3"></i></button>
          </td>
        </tr>
      `).join("");
    }

    function setupCouponForm() {
      const form = document.getElementById("admin-add-coupon-form");
      if (!form) return;

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const code = document.getElementById("coupon-code").value.trim().toUpperCase();
        const discountType = document.getElementById("coupon-type").value;
        const value = Number(document.getElementById("coupon-val").value);
        const minSpend = Number(document.getElementById("coupon-min").value);
        const expiryDate = document.getElementById("coupon-expiry").value;

        const newCoupon = {
          id: `coup-${Date.now()}`,
          code,
          discountType,
          value,
          minSpend,
          expiryDate,
          status: "active"
        };

        if (window.NestDB) {
          window.NestDB.insert("coupons", newCoupon);
          showToast(`Coupon ${code} added!`);
          form.reset();
          renderCoupons();
        }
      });
    }

    function deleteCoupon(id) {
      if (confirm("Delete this coupon code?")) {
        if (window.NestDB) {
          window.NestDB.delete("coupons", id);
          showToast("Coupon removed");
          renderCoupons();
        }
      }
    }
  </script>
</body>
</html>
